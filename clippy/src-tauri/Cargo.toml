[package]
name = "clippy"
version = "0.1.0"
description = "Video clip editor"
authors = ["devin"]
edition = "2021"

[lib]
name = "clippy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
arboard = { version = "3", default-features = false, features = ["image-data"] }
tokio = { version = "1", features = ["sync", "io-util", "process", "macros", "rt-multi-thread", "fs", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.7"
mime_guess = "2.0"
urlencoding = "2.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
